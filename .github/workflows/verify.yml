name: Verify Baekho Tools
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:map
      - run: npm run test:combat
      - run: npm run test:hit-timer
      - run: npm run build
      - run: npm run test:integration
      - run: npm run test:updates
