<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="505" viewBox="0 0 1200 505">
<title>원본 보존과 두 가지 내보내기</title>
<rect width="100%" height="100%" rx="16" fill="#F5F8FA"/>
<text x="32.0" y="51.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#142B3A">원본 보존과 두 가지 내보내기</text>
<rect x="30" y="180" width="320" height="130" rx="10" fill="white" stroke="#007D76" stroke-width="1.5"/>
<text x="49.0" y="219.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700" fill="#007D76">원본 폼 SO</text>
<text x="49.0" y="253.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#142B3A">런타임 실험은 복제본 사용</text>
<text x="49.0" y="283.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#142B3A">원본 자동 채택 없음</text>
<rect x="450" y="90" width="300" height="130" rx="10" fill="white" stroke="#365CBC" stroke-width="1.5"/>
<text x="469.0" y="129.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700" fill="#365CBC">단일 후보</text>
<text x="469.0" y="163.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#142B3A">선택 동작의 패치</text>
<text x="469.0" y="193.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#142B3A">복제 폼 + 필요 프로필</text>
<rect x="830" y="90" width="340" height="130" rx="10" fill="white" stroke="#365CBC" stroke-width="1.5"/>
<text x="849.0" y="129.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700" fill="#365CBC">CombatLabPreset</text>
<text x="849.0" y="163.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#142B3A">actionId + actionAsset</text>
<text x="849.0" y="193.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#142B3A">하위 폼을 게임에 연결</text>
<rect x="450" y="320" width="300" height="130" rx="10" fill="white" stroke="#AC641D" stroke-width="1.5"/>
<text x="469.0" y="359.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700" fill="#AC641D">동작별 최종 후보</text>
<text x="469.0" y="393.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#142B3A">같은 원본의 여러 동작</text>
<text x="469.0" y="423.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#142B3A">중복과 충돌 검증</text>
<rect x="830" y="320" width="340" height="130" rx="10" fill="white" stroke="#AC641D" stroke-width="1.5"/>
<text x="849.0" y="359.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700" fill="#AC641D">통합 폼 SO</text>
<text x="849.0" y="393.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#142B3A">실제 폼이 메인 에셋</text>
<text x="849.0" y="423.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#142B3A">파일을 게임에 바로 연결</text>
<polyline points="350,215 400,215 400,155 450,155" fill="none" stroke="#486272" stroke-width="2"/>
<polygon points="450.0,155.0 439.5,160.8 439.5,149.2" fill="#486272"/>
<polyline points="350,275 400,275 400,385 450,385" fill="none" stroke="#486272" stroke-width="2"/>
<polygon points="450.0,385.0 439.5,390.8 439.5,379.2" fill="#486272"/>
<polyline points="750,155 830,155" fill="none" stroke="#486272" stroke-width="2"/>
<polygon points="830.0,155.0 819.5,160.8 819.5,149.2" fill="#486272"/>
<polyline points="750,385 830,385" fill="none" stroke="#486272" stroke-width="2"/>
<polygon points="830.0,385.0 819.5,390.8 819.5,379.2" fill="#486272"/>
<text x="32.0" y="485.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="400" fill="#486272">두 방식 모두 Assets/ 아래의 새로운 .asset으로 저장합니다.</text>
</svg>