<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="unity-title unity-desc">
  <title id="unity-title">Unity 에셋 등록과 프리팹 생성</title>
  <desc id="unity-desc">Unity 프리팹의 등록 정보와 실측 경계를 앱으로 가져온다. 편집한 맵을 검증하고 배치 명세로 만든 뒤 MCP 직접 생성 또는 ZIP 메뉴 실행을 통해 같은 Unity 임포터에서 프리팹과 NavMesh 데이터를 저장한다. 요청 결과가 불명확하면 같은 요청 ID로 상태를 조회하며 자동 재생성하지 않는다. 스폰, 피해, 상호작용과 순간이동 실행은 게임 코드가 담당한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#57677e"/></marker>
    <marker id="accent-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#ae6a22"/></marker>
    <style>
      text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; fill: #172b44; font-size: 18px; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .muted { fill: #57677e; }
      .node { fill: #fff; stroke: #c9d4e3; stroke-width: 1.5; }
      .teal { fill: #eaf5f4; stroke: #186f78; stroke-width: 1.5; }
      .blue { fill: #edf2ff; stroke: #305dd7; stroke-width: 1.5; }
      .warn { fill: #fff5e8; stroke: #ae6a22; stroke-width: 1.5; }
      .line { fill: none; stroke: #57677e; stroke-width: 2; marker-end: url(#arrow); }
      .warn-line { fill: none; stroke: #ae6a22; stroke-width: 2; marker-end: url(#accent-arrow); }
    </style>
  </defs>
  <rect width="1120" height="660" rx="18" fill="#f5f7fb"/>
  <text x="40" y="46" class="title">Unity 에셋 등록과 프리팹 생성</text>
  <text x="40" y="76" class="muted">원본 프리팹을 GUID로 참조하고, 별도의 맵 프리팹과 이동 데이터를 저장합니다.</text>

  <rect x="40" y="108" width="280" height="102" rx="12" class="node"/>
  <text x="180" y="140" text-anchor="middle" class="label">Unity 에셋 등록</text>
  <text x="180" y="169" text-anchor="middle">Map Asset · Prop Set</text>
  <text x="180" y="195" text-anchor="middle" class="muted">종류 · 소품 목록 · 벽 모듈</text>
  <path d="M320 159 H405" class="line"/>
  <rect x="415" y="108" width="280" height="102" rx="12" class="teal"/>
  <text x="555" y="140" text-anchor="middle" class="label">실측 카탈로그</text>
  <text x="555" y="169" text-anchor="middle">격리된 Preview Scene</text>
  <text x="555" y="195" text-anchor="middle" class="muted">경계 · 피벗 · 연결점</text>
  <path d="M695 159 H780" class="line"/>
  <rect x="790" y="108" width="290" height="102" rx="12" class="blue"/>
  <text x="935" y="140" text-anchor="middle" class="label">앱 AssetBinding</text>
  <text x="935" y="169" text-anchor="middle">최신 GUID · 경로 대조</text>
  <text x="935" y="195" text-anchor="middle" class="muted">앱에서 편집한 설정 보존</text>

  <text x="40" y="250" class="label">맵을 Unity 결과로 변환</text>
  <rect x="40" y="278" width="155" height="94" rx="12" class="node"/>
  <text x="117.5" y="313" text-anchor="middle" class="label">편집한 맵</text>
  <text x="117.5" y="342" text-anchor="middle" class="muted">배치 · 에셋 연결</text>
  <path d="M195 325 H215" class="line"/>
  <rect x="225" y="278" width="200" height="94" rx="12" class="teal"/>
  <text x="325" y="313" text-anchor="middle" class="label">검증과 배치 명세</text>
  <text x="325" y="342" text-anchor="middle" class="muted">맵 오류 · 프리팹 출처</text>
  <path d="M425 325 H439 V292 H447" class="line"/>
  <path d="M439 325 V358 H447" class="line"/>
  <rect x="455" y="269" width="155" height="47" rx="10" class="blue"/>
  <text x="532.5" y="299" text-anchor="middle" class="label">MCP 직접 생성</text>
  <rect x="455" y="335" width="155" height="47" rx="10" class="node"/>
  <text x="532.5" y="365" text-anchor="middle" class="label">ZIP 메뉴 실행</text>
  <path d="M610 292 H625 V325 H632" class="line"/>
  <path d="M610 358 H625 V325" fill="none" stroke="#57677e" stroke-width="2"/>
  <rect x="640" y="278" width="180" height="94" rx="12" class="node"/>
  <text x="730" y="313" text-anchor="middle" class="label">공통 임포터</text>
  <text x="730" y="342" text-anchor="middle" class="muted">격리 조립 · 베이크</text>
  <path d="M820 325 H840" class="line"/>
  <rect x="850" y="278" width="230" height="94" rx="12" class="blue"/>
  <text x="965" y="313" text-anchor="middle" class="label">새 프리팹과 NavMesh</text>
  <text x="965" y="342" text-anchor="middle" class="muted">기존 결과와 열린 씬 보존</text>
  <text x="40" y="404" class="muted">직접 생성 경로: Assets/Baekho/Generated/맵 이름/</text>

  <text x="40" y="443" class="label">요청 상태와 연결 중단 복구</text>
  <rect x="40" y="485" width="180" height="83" rx="12" class="node"/>
  <text x="130" y="520" text-anchor="middle" class="label">running</text>
  <text x="130" y="548" text-anchor="middle" class="muted">요청 ID · 해시 저장</text>
  <path d="M220 526 H257 V477 H292" class="line"/>
  <path d="M257 526 H292" class="line"/>
  <path d="M257 526 V582 H292" class="warn-line"/>
  <rect x="300" y="455" width="190" height="43" rx="9" class="teal"/>
  <text x="395" y="484" text-anchor="middle">completed · 저장 완료</text>
  <rect x="300" y="505" width="190" height="43" rx="9" class="node"/>
  <text x="395" y="534" text-anchor="middle">failed · 생성 실패</text>
  <rect x="300" y="560" width="190" height="43" rx="9" class="warn"/>
  <text x="395" y="589" text-anchor="middle">unknown · 결과 불명</text>
  <path d="M490 582 H630" class="warn-line"/>
  <rect x="640" y="550" width="440" height="63" rx="12" class="warn"/>
  <text x="860" y="577" text-anchor="middle" class="label">같은 요청 ID로 상태만 조회</text>
  <text x="860" y="602" text-anchor="middle" class="muted">자동 재생성하지 않음 · Unity 영수증 확인</text>
  <text x="40" y="639" class="muted">게임 로직은 별도입니다. 스폰 · 피해 · 상호작용 · 순간이동 실행은 게임 코드가 담당합니다.</text>
</svg>
