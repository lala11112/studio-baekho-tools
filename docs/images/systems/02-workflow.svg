<text x="839.0" y="343.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#142B3A">영상 · 명중 PNG · 적용값</text>
<rect x="425" y="270" width="350" height="110" rx="10" fill="white" stroke="#365CBC" stroke-width="1.5"/>
<text x="444.0" y="309.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700" fill="#365CBC">5 선택과 이유</text>
<text x="444.0" y="343.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#142B3A">선호 후보 기록 · 재확인</text>
<rect x="30" y="270" width="350" height="110" rx="10" fill="white" stroke="#AC641D" stroke-width="1.5"/>
<text x="49.0" y="309.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="23" font-weight="700" fill="#AC641D">6 새 SO 저장</text>
<text x="49.0" y="343.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#142B3A">단일 프리셋 / 통합 폼</text>
<polyline points="995,200 995,270" fill="none" stroke="#486272" stroke-width="2"/>
<polygon points="995.0,270.0 989.2,259.5 1000.8,259.5" fill="#486272"/>
<polyline points="820,325 775,325" fill="none" stroke="#486272" stroke-width="2"/>
<polygon points="775.0,325.0 785.5,319.2 785.5,330.8" fill="#486272"/>
<polyline points="425,325 380,325" fill="none" stroke="#486272" stroke-width="2"/>
<polygon points="380.0,325.0 390.5,319.2 390.5,330.8" fill="#486272"/>
<polyline points="600,270 600,200" fill="none" stroke="#486272" stroke-width="2"/>
