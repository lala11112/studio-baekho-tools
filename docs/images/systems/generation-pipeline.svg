<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="generation-title generation-desc">
  <title id="generation-title">맵 생성 파이프라인</title>
  <desc id="generation-desc">설정 확정과 컨셉 작성 후 이미지 생성과 분석 또는 지형 직접 설계로 분기한다. 두 방식은 지형 검사에서 합류하고 로컬 배치와 최종 검증을 거쳐 편집 맵에 적용된다. 부분 재생성은 보호 대상을 병합한 뒤 로컬 배치와 검증을 수행한다.</desc>
  <defs>
    <marker id="generation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57677e"/></marker>
    <style>
      text { font-family: 'Malgun Gothic', sans-serif; fill: #172b44; font-size: 18px; }
      .heading { font-size: 28px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 700; }
      .muted { fill: #57677e; }
      .blue { fill: #305dd7; }
      .teal { fill: #186f78; }
      .box { fill: #ffffff; stroke: #cbd5e4; stroke-width: 2; }
      .flow { fill: none; stroke: #57677e; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#generation-arrow); }
      .branch { fill: none; stroke: #57677e; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1120" height="560" fill="#f5f7fb"/>
  <text x="40" y="48" class="heading">맵 생성 파이프라인</text>
  <text x="40" y="79" class="muted">AI가 지형을 설계하고 로컬 시스템이 배치와 안전 조건을 확인한다</text>

  <rect x="40" y="170" width="150" height="84" rx="14" class="box"/>
  <text x="115" y="204" text-anchor="middle" class="label">설정 확정</text>
  <text x="115" y="233" text-anchor="middle" class="muted">규격 · 기능 · 시드</text>
  <path d="M 190 212 H 225" class="flow"/>

  <rect x="225" y="170" width="150" height="84" rx="14" class="box"/>
  <text x="300" y="204" text-anchor="middle" class="label">컨셉</text>
  <text x="300" y="233" text-anchor="middle" class="muted">AI 또는 직접 입력</text>
  <path d="M 375 212 H 410" class="branch"/>
  <path d="M 410 212 V 149 H 440" class="flow"/>
  <path d="M 410 212 V 279 H 440" class="flow"/>
  <circle cx="410" cy="212" r="4" fill="#57677e"/>

  <rect x="440" y="110" width="250" height="78" rx="14" fill="#eef2ff" stroke="#305dd7" stroke-width="2"/>
  <text x="565" y="141" text-anchor="middle" class="label blue">이미지 기반</text>
  <text x="565" y="169" text-anchor="middle">PNG 생성 → 이미지 분석</text>
  <rect x="440" y="240" width="250" height="78" rx="14" fill="#eaf6f4" stroke="#186f78" stroke-width="2"/>
  <text x="565" y="271" text-anchor="middle" class="label teal">빠른 생성</text>
  <text x="565" y="299" text-anchor="middle">컨셉 → 지형 JSON</text>
  <path d="M 690 149 H 735 V 212" class="branch"/>
  <path d="M 690 279 H 735 V 212" class="branch"/>
  <circle cx="735" cy="212" r="4" fill="#57677e"/>
  <path d="M 735 212 H 780" class="flow"/>

  <rect x="780" y="170" width="300" height="84" rx="14" class="box"/>
  <text x="930" y="204" text-anchor="middle" class="label">지형 검사</text>
  <text x="930" y="233" text-anchor="middle" class="muted">형식 · 규격 · 높이 · 문 · 연결</text>
  <path d="M 930 254 V 343 H 175 V 375" class="flow"/>

  <rect x="40" y="375" width="270" height="90" rx="14" fill="#eaf6f4" stroke="#186f78" stroke-width="2"/>
  <text x="175" y="409" text-anchor="middle" class="label teal">로컬 배치</text>
  <text x="175" y="440" text-anchor="middle">시설 · 소품 · 벽 부착 · 지점</text>
  <path d="M 310 420 H 425" class="flow"/>
  <rect x="425" y="375" width="270" height="90" rx="14" class="box"/>
  <text x="560" y="409" text-anchor="middle" class="label">최종 검증</text>
  <text x="560" y="440" text-anchor="middle" class="muted">이동 · 충돌 · 생성 조건</text>
  <path d="M 695 420 H 810" class="flow"/>
  <text x="752" y="398" text-anchor="middle" class="teal">통과</text>
  <rect x="810" y="375" width="270" height="90" rx="14" fill="#eef2ff" stroke="#305dd7" stroke-width="2"/>
  <text x="945" y="409" text-anchor="middle" class="label blue">편집 맵에 적용</text>
  <text x="945" y="440" text-anchor="middle">3D 확인 · 편집 · Undo</text>

  <text x="40" y="509" class="muted">부분 재생성은 보호 대상을 먼저 병합한 뒤 로컬 배치와 최종 검증을 수행한다.</text>
  <text x="40" y="539" fill="#ae6a22" style="fill:#ae6a22">검증 실패 또는 취소 시 기존 편집 맵을 유지한다.</text>
</svg>
