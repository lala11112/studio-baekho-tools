  <line x1="1014" y1="473" x2="1014" y2="570" stroke="#305dd7" stroke-width="2"/>
  <line x1="1008" y1="473" x2="1020" y2="473" stroke="#305dd7" stroke-width="2"/>
  <line x1="1008" y1="570" x2="1020" y2="570" stroke="#305dd7" stroke-width="2"/>
  <text x="1026" y="529" class="blue">h</text>
  <text x="919" y="590" class="blue">캐릭터 높이</text>
  <text x="702" y="616" class="muted">바닥 지지 · 머리 여유 · 문까지의 안전 경로</text>
</svg>
