<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="04-timing-title 04-timing-desc">
<title id="04-timing-title">히트와 콤보 전환 및 공격 종료</title><desc id="04-timing-desc">2초 클립의 설명용 예시. 두 히트가 끝난 뒤 1.35초에 콤보를 전환하고 1.70초에 공격을 종료한다. 실제 측정값이 아니다.</desc>
<defs><marker id="04-timing-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="#7b8b9e" stroke-width="2"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans KR, Arial, sans-serif"><rect width="1120" height="570" rx="20" fill="#f7f9fc"/><text x="30" y="40" font-size="24" fill="#1c3449" font-weight="700" text-anchor="start">히트와 콤보 전환 및 공격 종료</text><line x1="190" y1="110" x2="190" y2="385" stroke="#d9e1eb" stroke-dasharray="4 6"/><text x="190" y="92" font-size="17" fill="#536477" font-weight="400" text-anchor="middle">0.0초</text><line x1="400" y1="110" x2="400" y2="385" stroke="#d9e1eb" stroke-dasharray="4 6"/><text x="400" y="92" font-size="17" fill="#536477" font-weight="400" text-anchor="middle">0.5초</text><line x1="610" y1="110" x2="610" y2="385" stroke="#d9e1eb" stroke-dasharray="4 6"/><text x="610" y="92" font-size="17" fill="#536477" font-weight="400" text-anchor="middle">1.0초</text><line x1="820" y1="110" x2="820" y2="385" stroke="#d9e1eb" stroke-dasharray="4 6"/><text x="820" y="92" font-size="17" fill="#536477" font-weight="400" text-anchor="middle">1.5초</text><line x1="1030" y1="110" x2="1030" y2="385" stroke="#d9e1eb" stroke-dasharray="4 6"/><text x="1030" y="92" font-size="17" fill="#536477" font-weight="400" text-anchor="middle">2.0초</text><text x="35" y="147" font-size="19" fill="#213347" font-weight="700" text-anchor="start">원본 클립</text><rect x="190" y="120" width="840" height="35" rx="8" fill="#dce5f0"/><text x="610" y="145" font-size="17" fill="#536477" font-weight="500" text-anchor="middle">원본 동작 전체 2.00초</text><text x="35" y="217" font-size="19" fill="#213347" font-weight="700" text-anchor="start">히트 활성 구간</text><rect x="379" y="190" width="84" height="35" rx="8" fill="#5fa5e7"/><rect x="610" y="190" width="84" height="35" rx="8" fill="#5fa5e7"/><text x="421" y="249" font-size="17" fill="#245b9a" font-weight="700" text-anchor="middle">1타</text><text x="652" y="249" font-size="17" fill="#245b9a" font-weight="700" text-anchor="middle">2타</text><text x="35" y="312" font-size="19" fill="#213347" font-weight="700" text-anchor="start">공격 유효 시간</text><rect x="190" y="285" width="714" height="35" rx="8" fill="#c6e8dd"/><line x1="757" y1="165" x2="757" y2="373" stroke="#a77820" stroke-width="3"/><line x1="904" y1="165" x2="904" y2="373" stroke="#16735f" stroke-width="3"/><text x="757" y="400" font-size="17" fill="#915c16" font-weight="700" text-anchor="middle">콤보 전환 1.35초</text><text x="904" y="430" font-size="17" fill="#16735f" font-weight="700" text-anchor="middle">공격 종료 1.70초</text><text x="35" y="478" font-size="18" fill="#536477" font-weight="700" text-anchor="start">설명용 예시</text><text x="185" y="478" font-size="18" fill="#213347" font-weight="400" text-anchor="start">마지막 히트 보존 → 다음 콤보 연결 → 공격 종료</text><text x="35" y="516" font-size="17" fill="#536477" font-weight="400" text-anchor="start">종료가 히트를 자르면 저장을 막는다. 수동 조기 콤보는 타격 생략 경고 후 저장할 수 있다.</text><text x="35" y="545" font-size="17" fill="#536477" font-weight="400" text-anchor="start">종료 뒤에도 원본 클립을 재생해 남은 동작을 확인할 수 있다.</text></g></svg>
