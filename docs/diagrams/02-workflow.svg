<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="02-workflow-title 02-workflow-desc">
<title id="02-workflow-title">검색부터 검토와 저장까지</title><desc id="02-workflow-desc">윗줄은 자동 분석이며 아랫줄은 사용자 검토와 명시적인 저장이다. 분석 완료는 저장 완료가 아니다.</desc>
<defs><marker id="02-workflow-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="#7b8b9e" stroke-width="2"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans KR, Arial, sans-serif"><rect width="1120" height="620" rx="20" fill="#f7f9fc"/><text x="30" y="40" font-size="24" fill="#1c3449" font-weight="700" text-anchor="start">검색부터 검토와 저장까지</text><text x="35" y="85" font-size="18" fill="#245b9a" font-weight="700" text-anchor="start">① 입력과 자동 분석</text><rect x="35" y="110" width="230" height="125" rx="14" fill="#eef5ff" stroke="#b5cdeb"/><text x="55" y="144" font-size="21" fill="#245b9a" font-weight="700" text-anchor="start">클립 선택</text><text x="55" y="175" font-size="17" fill="#213347" font-weight="400" text-anchor="start">자연어 · 이름 검색</text><text x="55" y="201" font-size="17" fill="#213347" font-weight="400" text-anchor="start">FBX · ANIM 가져오기</text><rect x="305" y="110" width="230" height="125" rx="14" fill="#e9f7f3" stroke="#9acfc0"/><text x="325" y="144" font-size="21" fill="#16735f" font-weight="700" text-anchor="start">24fps 전체 촬영</text><text x="325" y="175" font-size="17" fill="#213347" font-weight="400" text-anchor="start">두 시점 PNG</text><text x="325" y="201" font-size="17" fill="#213347" font-weight="400" text-anchor="start">2초 단위 히트 분석</text><rect x="575" y="110" width="230" height="125" rx="14" fill="#e9f7f3" stroke="#9acfc0"/><text x="595" y="144" font-size="21" fill="#16735f" font-weight="700" text-anchor="start">60fps 경계 확인</text><text x="595" y="175" font-size="17" fill="#213347" font-weight="400" text-anchor="start">시작·종료 주변 촬영</text><text x="595" y="201" font-size="17" fill="#213347" font-weight="400" text-anchor="start">타격별 경계 재분석</text><rect x="845" y="110" width="240" height="125" rx="14" fill="#f2effb" stroke="#c8bceb"/><text x="865" y="144" font-size="21" fill="#6946a3" font-weight="700" text-anchor="start">전환과 종료 제안</text><text x="865" y="175" font-size="17" fill="#213347" font-weight="400" text-anchor="start">전체 동작의 회복 확인</text><text x="865" y="201" font-size="17" fill="#213347" font-weight="400" text-anchor="start">후보 주변 재촬영</text><polyline points="265,172 305,172" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#02-workflow-arrow)"/><polyline points="535,172 575,172" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#02-workflow-arrow)"/><polyline points="805,172 845,172" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#02-workflow-arrow)"/><polyline points="965,235 965,285 150,285 150,365" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#02-workflow-arrow)"/><text x="550" y="273" font-size="16" fill="#536477" font-weight="500" text-anchor="middle">분석 완료 → 검토 초안</text><text x="35" y="335" font-size="18" fill="#915c16" font-weight="700" text-anchor="start">② 사용자 검토와 저장</text><rect x="35" y="365" width="230" height="135" rx="14" fill="#fff5e5" stroke="#e6c58d"/><text x="55" y="399" font-size="21" fill="#915c16" font-weight="700" text-anchor="start">프레임과 시간 검토</text><text x="55" y="430" font-size="17" fill="#213347" font-weight="400" text-anchor="start">히트 구간 편집</text><text x="55" y="456" font-size="17" fill="#213347" font-weight="400" text-anchor="start">추천 채택 · 직접 입력</text><text x="55" y="482" font-size="17" fill="#213347" font-weight="400" text-anchor="start">불확실한 부분 확인</text><rect x="305" y="365" width="230" height="135" rx="14" fill="#fff5e5" stroke="#e6c58d"/><text x="325" y="399" font-size="21" fill="#915c16" font-weight="700" text-anchor="start">저장 대상 설정</text><text x="325" y="430" font-size="17" fill="#213347" font-weight="400" text-anchor="start">기존 수정 · 새 공격</text><text x="325" y="456" font-size="17" fill="#213347" font-weight="400" text-anchor="start">기존 타격과 대응</text><text x="325" y="482" font-size="17" fill="#213347" font-weight="400" text-anchor="start">검토 완료 표시</text><rect x="575" y="365" width="230" height="135" rx="14" fill="#fff5e5" stroke="#e6c58d"/><text x="595" y="399" font-size="21" fill="#915c16" font-weight="700" text-anchor="start">변경 미리보기</text><text x="595" y="430" font-size="17" fill="#213347" font-weight="400" text-anchor="start">타수 · 피해 · 시간</text><text x="595" y="456" font-size="17" fill="#213347" font-weight="400" text-anchor="start">원본 변경 · 경고 확인</text><text x="595" y="482" font-size="17" fill="#213347" font-weight="400" text-anchor="start">저장 가능 여부</text><rect x="845" y="365" width="240" height="135" rx="14" fill="#e9f7f3" stroke="#9acfc0"/><text x="865" y="399" font-size="21" fill="#16735f" font-weight="700" text-anchor="start">명시적 저장</text><text x="865" y="430" font-size="17" fill="#213347" font-weight="400" text-anchor="start">앱 기본값은 복사 저장</text><text x="865" y="456" font-size="17" fill="#213347" font-weight="400" text-anchor="start">필요 시 원본 적용</text><text x="865" y="482" font-size="17" fill="#213347" font-weight="400" text-anchor="start">결과 에셋을 게임에 연결</text><polyline points="265,432 305,432" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#02-workflow-arrow)"/><polyline points="535,432 575,432" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#02-workflow-arrow)"/><polyline points="805,432 845,432" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#02-workflow-arrow)"/><text x="35" y="553" font-size="17" fill="#536477" font-weight="700" text-anchor="start">작업 상태</text><text x="145" y="553" font-size="19" fill="#213347" font-weight="400" text-anchor="start">초안 → 촬영 중 → 분석 중 → 검토 → 저장 완료</text><text x="35" y="586" font-size="17" fill="#536477" font-weight="400" text-anchor="start">실패·취소는 별도 상태로 보존한다. 분석 후 자동으로 에셋을 저장하지 않는다.</text></g></svg>
