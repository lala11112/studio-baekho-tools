<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="06-data-title 06-data-desc">
<title id="06-data-title">클립과 작업 및 저장 기록의 식별</title><desc id="06-data-desc">클립, 작업, 촬영 프레임, 공격 대상, 변경 검토와 통신 요청은 각각 별도의 식별자를 사용한다.</desc>
<defs><marker id="06-data-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="#7b8b9e" stroke-width="2"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans KR, Arial, sans-serif"><rect width="1120" height="580" rx="20" fill="#f7f9fc"/><text x="30" y="40" font-size="24" fill="#1c3449" font-weight="700" text-anchor="start">클립과 작업 및 저장 기록의 식별</text><rect x="35" y="105" width="310" height="130" rx="14" fill="#eef5ff" stroke="#b5cdeb"/><text x="55" y="139" font-size="21" fill="#245b9a" font-weight="700" text-anchor="start">클립 참조</text><text x="55" y="170" font-size="17" fill="#213347" font-weight="400" text-anchor="start">GUID + localId 문자열</text><text x="55" y="196" font-size="17" fill="#213347" font-weight="400" text-anchor="start">원본 지문 · 길이 · 상태 문맥</text><rect x="405" y="105" width="310" height="160" rx="14" fill="#eef5ff" stroke="#b5cdeb"/><text x="425" y="139" font-size="21" fill="#245b9a" font-weight="700" text-anchor="start">분석 작업</text><text x="425" y="170" font-size="17" fill="#213347" font-weight="400" text-anchor="start">job.id · 상태 · 검토 표시</text><text x="425" y="196" font-size="17" fill="#213347" font-weight="400" text-anchor="start">히트 구간 · 시간 편집</text><text x="425" y="222" font-size="17" fill="#213347" font-weight="400" text-anchor="start">AI 추천 · 이전 분석 버전</text><rect x="775" y="105" width="310" height="130" rx="14" fill="#e9f7f3" stroke="#9acfc0"/><text x="795" y="139" font-size="21" fill="#16735f" font-weight="700" text-anchor="start">촬영 프레임</text><text x="795" y="170" font-size="17" fill="#213347" font-weight="400" text-anchor="start">배치 UUID가 포함된 ID</text><text x="795" y="196" font-size="17" fill="#213347" font-weight="400" text-anchor="start">클립 시각 · PNG 경로</text><polyline points="345,170 405,170" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#06-data-arrow)"/><polyline points="775,170 715,170" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#06-data-arrow)"/><rect x="35" y="355" width="310" height="155" rx="14" fill="#fff5e5" stroke="#e6c58d"/><text x="55" y="389" font-size="21" fill="#915c16" font-weight="700" text-anchor="start">공격 대상</text><text x="55" y="420" font-size="17" fill="#213347" font-weight="400" text-anchor="start">SO GUID + 직렬화 경로</text><text x="55" y="446" font-size="17" fill="#213347" font-weight="400" text-anchor="start">기존 타격 sourceIndex</text><text x="55" y="472" font-size="17" fill="#213347" font-weight="400" text-anchor="start">신규 타격은 -1</text><rect x="405" y="355" width="310" height="155" rx="14" fill="#fff5e5" stroke="#e6c58d"/><text x="425" y="389" font-size="21" fill="#915c16" font-weight="700" text-anchor="start">변경 검토와 저널</text><text x="425" y="420" font-size="17" fill="#213347" font-weight="400" text-anchor="start">changeId · 원본 스냅샷</text><text x="425" y="446" font-size="17" fill="#213347" font-weight="400" text-anchor="start">변경 전후 · 백업</text><text x="425" y="472" font-size="17" fill="#213347" font-weight="400" text-anchor="start">preview / applying / complete</text><rect x="775" y="355" width="310" height="155" rx="14" fill="#f3f5f8" stroke="#cdd5e0"/><text x="795" y="389" font-size="21" fill="#536477" font-weight="700" text-anchor="start">통신 요청과 영수증</text><text x="795" y="420" font-size="17" fill="#213347" font-weight="400" text-anchor="start">requestId · 만료 시각</text><text x="795" y="446" font-size="17" fill="#213347" font-weight="400" text-anchor="start">명령 · 처리 결과</text><text x="795" y="472" font-size="17" fill="#213347" font-weight="400" text-anchor="start">동일 ID의 응답 연결</text><polyline points="345,430 405,430" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#06-data-arrow)"/><polyline points="560,265 560,355" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#06-data-arrow)"/><text x="640" y="315" font-size="16" fill="#536477" font-weight="500" text-anchor="middle">검토할 변경</text><polyline points="715,430 775,430" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#06-data-arrow)"/><text x="35" y="550" font-size="17" fill="#536477" font-weight="400" text-anchor="start">이름은 표시용이다. 클립·공격·프레임·저장 요청을 ID로 연결해 동명이인과 중복 적용을 구분한다.</text></g></svg>
