<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="01-architecture-title 01-architecture-desc">
<title id="01-architecture-title">시스템의 역할과 연결</title><desc id="01-architecture-desc">앱이 사용자 검토와 초안을 관리하고 Codex가 후보를 제안하며 Unity가 촬영과 에셋 저장을 수행한다.</desc>
<defs><marker id="01-architecture-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="#7b8b9e" stroke-width="2"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans KR, Arial, sans-serif"><rect width="1120" height="650" rx="20" fill="#f7f9fc"/><text x="30" y="40" font-size="24" fill="#1c3449" font-weight="700" text-anchor="start">시스템의 역할과 연결</text><rect x="30" y="75" width="640" height="310" rx="18" fill="#fff" stroke="#d8e1ea"/><text x="52" y="110" font-size="18" fill="#536477" font-weight="700" text-anchor="start">WINDOWS 데스크톱 앱</text><rect x="55" y="130" width="180" height="145" rx="14" fill="#eef5ff" stroke="#b5cdeb"/><text x="75" y="164" font-size="21" fill="#245b9a" font-weight="700" text-anchor="start">화면</text><text x="75" y="195" font-size="17" fill="#213347" font-weight="400" text-anchor="start">검색 · 작업 목록</text><text x="75" y="221" font-size="17" fill="#213347" font-weight="400" text-anchor="start">재생 · 시간 편집</text><text x="75" y="247" font-size="17" fill="#213347" font-weight="400" text-anchor="start">변경 검토</text><rect x="280" y="130" width="360" height="145" rx="14" fill="#eef5ff" stroke="#b5cdeb"/><text x="300" y="164" font-size="21" fill="#245b9a" font-weight="700" text-anchor="start">메인 프로세스와 Controller</text><text x="300" y="195" font-size="17" fill="#213347" font-weight="400" text-anchor="start">허용 API · IPC 송신자 검사</text><text x="300" y="221" font-size="17" fill="#213347" font-weight="400" text-anchor="start">순차 분석 · 검토 상태 관리</text><text x="300" y="247" font-size="17" fill="#213347" font-weight="400" text-anchor="start">AI와 Unity 요청 · 저장 복구</text><polyline points="235,200 280,200" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#01-architecture-arrow)"/><text x="258" y="187" font-size="16" fill="#536477" font-weight="500" text-anchor="middle">IPC</text><text x="55" y="325" font-size="18" fill="#536477" font-weight="400" text-anchor="start">Store → 프로젝트별 초안 · 이전 분석 · 미확정 저장 ID</text><text x="55" y="355" font-size="16" fill="#536477" font-weight="400" text-anchor="start">원본 이미지 경로 대신 허용된 PNG의 토큰 URL 사용</text><rect x="735" y="110" width="355" height="190" rx="14" fill="#f2effb" stroke="#c8bceb"/><text x="755" y="144" font-size="21" fill="#6946a3" font-weight="700" text-anchor="start">Codex CLI</text><text x="755" y="175" font-size="17" fill="#213347" font-weight="400" text-anchor="start">검색 메타데이터 비교</text><text x="755" y="201" font-size="17" fill="#213347" font-weight="400" text-anchor="start">촬영 이미지의 히트·전환 제안</text><text x="755" y="227" font-size="17" fill="#213347" font-weight="400" text-anchor="start">프레임 ID를 선택하는 JSON 응답</text><text x="755" y="253" font-size="17" fill="#213347" font-weight="400" text-anchor="start">기존 로그인 · 설정된 모델</text><polyline points="640,185 735,185" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#01-architecture-arrow)"/><text x="687" y="173" font-size="16" fill="#536477" font-weight="500" text-anchor="middle">입력</text><polyline points="735,235 670,235" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#01-architecture-arrow)"/><text x="703" y="258" font-size="16" fill="#536477" font-weight="500" text-anchor="middle">후보</text><rect x="30" y="425" width="1060" height="190" rx="18" fill="#fff" stroke="#d8e1ea"/><text x="52" y="460" font-size="18" fill="#536477" font-weight="700" text-anchor="start">UNITY EDITOR</text><rect x="55" y="480" width="270" height="105" rx="14" fill="#f3f5f8" stroke="#cdd5e0"/><text x="75" y="514" font-size="21" fill="#536477" font-weight="700" text-anchor="start">파일 mailbox</text><text x="75" y="545" font-size="17" fill="#213347" font-weight="400" text-anchor="start">요청 · 응답 · 처리 영수증</text><rect x="375" y="480" width="310" height="105" rx="14" fill="#e9f7f3" stroke="#9acfc0"/><text x="395" y="514" font-size="21" fill="#16735f" font-weight="700" text-anchor="start">공용 Editor 패키지</text><text x="395" y="545" font-size="17" fill="#213347" font-weight="400" text-anchor="start">검색 · 임포트 · 두 시점 촬영</text><rect x="735" y="480" width="330" height="105" rx="14" fill="#fff5e5" stroke="#e6c58d"/><text x="755" y="514" font-size="21" fill="#915c16" font-weight="700" text-anchor="start">사인검 어댑터</text><text x="755" y="545" font-size="17" fill="#213347" font-weight="400" text-anchor="start">공격 매핑 · SO와 Controller 저장</text><polyline points="460,385 460,405 190,405 190,480" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#01-architecture-arrow)"/><text x="615" y="412" font-size="16" fill="#536477" font-weight="500" text-anchor="middle">JSON 파일</text><polyline points="325,530 375,530" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#01-architecture-arrow)"/><polyline points="685,530 735,530" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#01-architecture-arrow)"/></g></svg>
