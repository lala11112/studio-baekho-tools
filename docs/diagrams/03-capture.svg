<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="03-capture-title 03-capture-desc">
<title id="03-capture-title">독립된 장면에서 두 시점 촬영</title><desc id="03-capture-desc">원본 장면의 렌더 계층과 본만 복제하고 단일 클립을 수동 평가하여 게임 스크립트와 물리를 실행하지 않는다.</desc>
<defs><marker id="03-capture-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="#7b8b9e" stroke-width="2"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans KR, Arial, sans-serif"><rect width="1120" height="610" rx="20" fill="#f7f9fc"/><text x="30" y="40" font-size="24" fill="#1c3449" font-weight="700" text-anchor="start">독립된 장면에서 두 시점 촬영</text><rect x="35" y="105" width="300" height="160" rx="14" fill="#eef5ff" stroke="#b5cdeb"/><text x="55" y="139" font-size="21" fill="#245b9a" font-weight="700" text-anchor="start">저장된 열린 씬</text><text x="55" y="170" font-size="17" fill="#213347" font-weight="400" text-anchor="start">Animator · 캐릭터 본 계층</text><text x="55" y="196" font-size="17" fill="#213347" font-weight="400" text-anchor="start">메시 · 머티리얼 · 선택 무기</text><text x="55" y="222" font-size="17" fill="#213347" font-weight="400" text-anchor="start">클립 GUID와 하위 에셋 ID</text><rect x="410" y="105" width="335" height="160" rx="14" fill="#e9f7f3" stroke="#9acfc0"/><text x="430" y="139" font-size="21" fill="#16735f" font-weight="700" text-anchor="start">촬영용 렌더 계층</text><text x="430" y="170" font-size="17" fill="#213347" font-weight="400" text-anchor="start">Transform · 메시 · 스킨 메시</text><text x="430" y="196" font-size="17" fill="#213347" font-weight="400" text-anchor="start">본과 Avatar 연결</text><text x="430" y="222" font-size="17" fill="#213347" font-weight="400" text-anchor="start">원본을 Instantiate하지 않음</text><polyline points="335,185 410,185" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#03-capture-arrow)"/><text x="372" y="171" font-size="16" fill="#536477" font-weight="500" text-anchor="middle">복제</text><rect x="805" y="105" width="280" height="160" rx="14" fill="#e9f7f3" stroke="#9acfc0"/><text x="825" y="139" font-size="21" fill="#16735f" font-weight="700" text-anchor="start">수동 클립 평가</text><text x="825" y="170" font-size="17" fill="#213347" font-weight="400" text-anchor="start">PreviewRenderUtility</text><text x="825" y="196" font-size="17" fill="#213347" font-weight="400" text-anchor="start">단일 클립 Playable</text><text x="825" y="222" font-size="17" fill="#213347" font-weight="400" text-anchor="start">지정 시각 SetTime</text><polyline points="745,185 805,185" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#03-capture-arrow)"/><text x="40" y="315" font-size="19" fill="#536477" font-weight="500" text-anchor="start">게임 스크립트 · 물리 컴포넌트 · 애니메이션 이벤트 · 루트 모션 실행 제외</text><polyline points="945,265 945,350 555,350 555,385" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#03-capture-arrow)"/><rect x="35" y="385" width="630" height="170" rx="18" fill="#fff" stroke="#d8e1ea"/><text x="57" y="420" font-size="18" fill="#536477" font-weight="700" text-anchor="start">한 시각을 동기화한 두 시점</text><rect x="55" y="440" width="280" height="90" rx="14" fill="#eef5ff" stroke="#b5cdeb"/><text x="75" y="474" font-size="21" fill="#245b9a" font-weight="700" text-anchor="start">사선 512 × 512</text><rect x="355" y="440" width="280" height="90" rx="14" fill="#f2effb" stroke="#c8bceb"/><text x="375" y="474" font-size="21" fill="#6946a3" font-weight="700" text-anchor="start">측면 512 × 512</text><rect x="755" y="405" width="330" height="145" rx="14" fill="#f3f5f8" stroke="#cdd5e0"/><text x="775" y="439" font-size="21" fill="#536477" font-weight="700" text-anchor="start">1024 × 512 PNG</text><text x="775" y="470" font-size="17" fill="#213347" font-weight="400" text-anchor="start">프레임 ID + 클립 시각</text><text x="775" y="496" font-size="17" fill="#213347" font-weight="400" text-anchor="start">frames.json에 경로와 시간</text><text x="775" y="522" font-size="17" fill="#213347" font-weight="400" text-anchor="start">Library의 분석 세션에 보존</text><polyline points="665,480 755,480" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#03-capture-arrow)"/><text x="710" y="465" font-size="16" fill="#536477" font-weight="500" text-anchor="middle">합성</text><text x="35" y="586" font-size="17" fill="#536477" font-weight="400" text-anchor="start">24fps는 전체 동작, 60fps는 후보 주변을 촬영한다. 시간 기준은 속도 배율 전 클립 초다.</text></g></svg>
