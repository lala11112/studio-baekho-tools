<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="765" viewBox="0 0 1120 765" role="img" aria-labelledby="05-save-recovery-title 05-save-recovery-desc">
<title id="05-save-recovery-title">검토한 변경의 저장과 중단 복구</title><desc id="05-save-recovery-desc">적용 요청 전에 앱이 ID를 저장하고 Unity는 변경 전 저널을 남긴다. 결과 불명 시 재전송 없이 읽기 전용 조회로 복구한다.</desc>
<defs><marker id="05-save-recovery-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="#7b8b9e" stroke-width="2"/></marker></defs>
<g font-family="Malgun Gothic, Noto Sans KR, Arial, sans-serif"><rect width="1120" height="765" rx="20" fill="#f7f9fc"/><text x="30" y="40" font-size="24" fill="#1c3449" font-weight="700" text-anchor="start">검토한 변경의 저장과 중단 복구</text><rect x="35" y="100" width="230" height="125" rx="14" fill="#fff5e5" stroke="#e6c58d"/><text x="55" y="134" font-size="21" fill="#915c16" font-weight="700" text-anchor="start">사용자 검토</text><text x="55" y="165" font-size="17" fill="#213347" font-weight="400" text-anchor="start">히트 · 시간 · 대상 확정</text><text x="55" y="191" font-size="17" fill="#213347" font-weight="400" text-anchor="start">검토 완료 표시</text><rect x="305" y="100" width="230" height="125" rx="14" fill="#fff5e5" stroke="#e6c58d"/><text x="325" y="134" font-size="21" fill="#915c16" font-weight="700" text-anchor="start">previewChange</text><text x="325" y="165" font-size="17" fill="#213347" font-weight="400" text-anchor="start">변경 전후 비교</text><text x="325" y="191" font-size="17" fill="#213347" font-weight="400" text-anchor="start">원본 스냅샷 · changeId</text><rect x="575" y="100" width="230" height="125" rx="14" fill="#eef5ff" stroke="#b5cdeb"/><text x="595" y="134" font-size="21" fill="#245b9a" font-weight="700" text-anchor="start">앱 초안에 먼저 기록</text><text x="595" y="165" font-size="17" fill="#213347" font-weight="400" text-anchor="start">changeId + requestId</text><text x="595" y="191" font-size="17" fill="#213347" font-weight="400" text-anchor="start">pendingSave 보존</text><rect x="845" y="100" width="240" height="125" rx="14" fill="#e9f7f3" stroke="#9acfc0"/><text x="865" y="134" font-size="21" fill="#16735f" font-weight="700" text-anchor="start">Unity apply</text><text x="865" y="165" font-size="17" fill="#213347" font-weight="400" text-anchor="start">원본 재검사 · 백업</text><text x="865" y="191" font-size="17" fill="#213347" font-weight="400" text-anchor="start">applying 저널 → 변경</text><polyline points="265,162 305,162" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#05-save-recovery-arrow)"/><polyline points="535,162 575,162" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#05-save-recovery-arrow)"/><polyline points="805,162 845,162" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#05-save-recovery-arrow)"/><polyline points="965,225 965,315" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#05-save-recovery-arrow)"/><text x="1008" y="272" font-size="16" fill="#536477" font-weight="500" text-anchor="middle">완료 응답</text><rect x="845" y="315" width="240" height="110" rx="14" fill="#e9f7f3" stroke="#9acfc0"/><text x="865" y="349" font-size="21" fill="#16735f" font-weight="700" text-anchor="start">저장 완료</text><text x="865" y="380" font-size="17" fill="#213347" font-weight="400" text-anchor="start">최초 결과 · Undo 보존</text><polyline points="880,225 880,267 690,267 690,315" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#05-save-recovery-arrow)"/><text x="747" y="253" font-size="16" fill="#536477" font-weight="500" text-anchor="middle">결과 불명</text><rect x="575" y="315" width="230" height="110" rx="14" fill="#fff5e5" stroke="#e6c58d"/><text x="595" y="349" font-size="21" fill="#915c16" font-weight="700" text-anchor="start">작업 잠금</text><text x="595" y="380" font-size="17" fill="#213347" font-weight="400" text-anchor="start">편집 · 재분석 · 삭제 제한</text><rect x="35" y="315" width="440" height="110" rx="14" fill="#f3f5f8" stroke="#cdd5e0"/><text x="55" y="349" font-size="21" fill="#536477" font-weight="700" text-anchor="start">검토 이후 편집 또는 원본 변경</text><text x="55" y="380" font-size="17" fill="#213347" font-weight="400" text-anchor="start">기존 미리보기 무효화 → 다시 검토</text><polyline points="690,425 690,465" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#05-save-recovery-arrow)"/><rect x="450" y="465" width="470" height="95" rx="14" fill="#eef5ff" stroke="#b5cdeb"/><text x="470" y="499" font-size="21" fill="#245b9a" font-weight="700" text-anchor="start">브리지 응답과 saveStatus 조회</text><text x="470" y="530" font-size="17" fill="#213347" font-weight="400" text-anchor="start">저장 적용은 자동 재전송하지 않음</text><polyline points="550,560 550,590 190,590 190,625" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#05-save-recovery-arrow)"/><polyline points="685,560 685,590 550,590 550,625" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#05-save-recovery-arrow)"/><polyline points="815,560 815,590 930,590 930,625" fill="none" stroke="#7b8b9e" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#05-save-recovery-arrow)"/><rect x="35" y="625" width="310" height="100" rx="14" fill="#e9f7f3" stroke="#9acfc0"/><text x="55" y="659" font-size="21" fill="#16735f" font-weight="700" text-anchor="start">complete</text><text x="55" y="690" font-size="17" fill="#213347" font-weight="400" text-anchor="start">최초 결과로 저장 완료 복원</text><rect x="385" y="625" width="330" height="100" rx="14" fill="#eef5ff" stroke="#b5cdeb"/><text x="405" y="659" font-size="21" fill="#245b9a" font-weight="700" text-anchor="start">preview · rolled-back</text><text x="405" y="690" font-size="17" fill="#213347" font-weight="400" text-anchor="start">미적용 확인 → 잠금 해제</text><rect x="755" y="625" width="330" height="100" rx="14" fill="#fff5e5" stroke="#e6c58d"/><text x="775" y="659" font-size="21" fill="#915c16" font-weight="700" text-anchor="start">미확정 또는 복구 필요</text><text x="775" y="690" font-size="17" fill="#213347" font-weight="400" text-anchor="start">잠금 유지 · Unity 복구 메뉴</text></g></svg>
